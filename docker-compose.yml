version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: react-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: node-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000

